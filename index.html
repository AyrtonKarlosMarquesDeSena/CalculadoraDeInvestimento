<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculadora de Investimento</title>
  </head>
  <body class="grid grid-cols-3 grid-rows-2 gap-4 h-dvh">
    <aside
      class="flex justify-between bg-emerald-300 row-span-2 col-span-1 flex-col py-3 px-2"
    >
      <h1 class="font-bold text-black px-6 py-2 text-2xl">
        Calculadora de Investimento
      </h1>
      <form id="investment-form" class="w-full">
        <div class="flex w-full flex-col px-4 my-2 h-[4.25rem]">
          <label for="starting-amount" class="font-bold text-gray-700"
            >Investimento inicial</label
          >
          <div class="flex">
            <input
              value="R$"
              class="w-1/6 bg-emerald-200 text-center rounded-l-lg"
              type="text"
              disabled
            />
            <input
              type="text"
              placeholder="0.00"
              name="starting-amount"
              class="w-5/6 bg-white rounded-r-lg px-2"
              id="starting-amount"
              required
            />
          </div>
        </div>

        <div class="flex w-full flex-col px-4 my-2 h-[4.25rem]">
          <label for="additional-contribution" class="font-bold text-gray-700"
            >Aportes adicionais</label
          >
          <div class="flex">
            <input
              value="R$"
              class="w-1/6 bg-emerald-200 text-center rounded-l-lg"
              type="text"
              disabled
            />
            <input
              type="text"
              placeholder="0.00"
              class="w-5/6 rounded-r-lg bg-white px-2"
              id="additional-contribution"
              name="additional-contribution"
            />
          </div>
        </div>

        <div class="flex w-full flex-col px-4 my-2 h-[4.25rem]">
          <label for="time-amount" class="font-bold text-gray-700">Prazo</label>
          <div class="flex">
            <input
              placeholder="0"
              type="text"
              class="w-5/6 px-2 rounded-l-lg bg-white border-r-2 border-emerald-500"
              id="time-amount"
              required
              name="time-amount"
            />
            <select
              id="time-amount-period"
              required
              class="hover:bg-emerald-500 cursor-pointer text-center bg-white rounded-r-lg hover:text-slate-200"
            >
              <option value="monthly">Mensal</option>
              <option value="yearly">Anual</option>
            </select>
          </div>
        </div>

        <div class="flex w-full flex-col px-4 my-2 h-[4.25rem]">
          <label for="return-rate" class="font-bold text-gray-700"
            >Rentabilidade:</label
          >
          <div class="flex">
            <input
              value="%"
              class="w-1/6 bg-emerald-200 text-center rounded-l-lg"
              type="text"
              disabled
            />
            <input
              type="text"
              required
              placeholder="0"
              class="w-4/6 bg-white px-2 border-r-2 border-emerald-500"
              id="return-rate"
              name="return-rate"
            />
            <select
              required
              id="return-rate-period"
              class="hover:bg-emerald-500 cursor-pointer text-center bg-white rounded-r-lg hover:text-slate-200"
            >
              <option value="monthly">Mensal</option>
              <option value="yearly">Anual</option>
            </select>
          </div>
        </div>

        <div class="flex w-full flex-col px-4 my-2 h-[4.25rem]">
          <label for="tax-rate" class="font-bold text-gray-700"
            >Impostos sobre lucro:</label
          >
          <div class="flex">
            <input
              value="%"
              class="w-1/6 bg-emerald-200 text-center rounded-l-lg"
              type="text"
              disabled
            />
            <input
              type="text"
              required
              class="w-5/6 rounded-r-lg bg-white px-2"
              id="tax-rate"
              name="tax-rate"
              placeholder="0.00"
            />
          </div>
        </div>
      </form>
      <div class="flex h-12 px-6 my-8 w-full gap-2">
        <button
          id="calculte-results"
          form="investment-form"
          class="w-1/2 rounded-lg bg-emerald-950 text-slate-200 cursor-pointer hover:bg-emerald-800"
        >
          Calcular
        </button>
        <button
          id="clear-form"
          class="w-1/2 rounded-lg cursor-pointer hover:bg-emerald-500"
        >
          Limpar
        </button>
      </div>
    </aside>

    <main class="row-span-2 col-span-2">
      <!-- <section class="h-full" id="charts-container">
        <div class="h-[36%] flex flex-col items-center pb-10">
          <p class="font-bold text-lg">Resultado Final</p>
          <canvas id="final-money-ditribution"></canvas>
        </div>

        <div class="h-[56%] flex flex-col items-center">
          <p class="font-bold text-lg">Progressão</p>
          <canvas id="progression"></canvas>
        </div>
      </section> -->
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
